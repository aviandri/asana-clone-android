name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runners have the memory; the 2 GB cap in gradle.properties is for the shared dev box.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  unit:
    # :core / :feature JVM tests and :app Compose UI tests under Robolectric (SPEC-ANDROID §6).
    # Contract tests skip here (no MP_BASE_URL).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

  lint:
    # Android lint (errors fail, warnings stay in the report) + ktlint.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lint ktlintCheck
      - name: Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/ktlint/
          retention-days: 14

  contract:
    # Like the Mac repo's linux-contract: BE main, migrated + full seed, then the JVM contract tests
    # through the real client.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asana
      JWT_SECRET: ci-only-secret-at-least-16-chars
      APP_URL: http://localhost:5173
      APP_TIMEZONE: Asia/Jakarta
      NODE_ENV: development
      PORT: "3000"
      HOST: 127.0.0.1
      # The contract suite logs in many times from one IP; the BE default is 10/min.
      AUTH_RATE_LIMIT_MAX: "1000"
      MP_BASE_URL: http://127.0.0.1:3000
      # Attachments (BE SPEC §13): the same BE build and DB on two more ports, for the 429 and
      # 507 cases. Contract tests that need one skip when its variable is unset (local runs).
      MP_BASE_URL_RATELIMIT: http://127.0.0.1:3001
      MP_BASE_URL_NOSPACE: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aviandri/asana-clone-be
          # github.token can only read this repo; if asana-clone-be is private, add a fine-grained
          # read-only PAT (Contents: read on asana-clone-be) as the BE_REPO_TOKEN secret.
          token: ${{ secrets.BE_REPO_TOKEN || github.token }}
          ref: main
          path: be
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: be/package-lock.json
      - name: Backend (migrate, build, seed, start)
        working-directory: be
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build
          npm run seed
          export STORAGE_DIR="$RUNNER_TEMP/attachments"
          nohup npm start > ../be.log 2>&1 &
          # :3001 allows 3 uploads a minute (429 RATE_LIMITED); :3002 always wants more free space
          # than the disk has (507 INSUFFICIENT_STORAGE).
          PORT=3001 UPLOAD_RATE_LIMIT_MAX=3 nohup npm start > ../be-ratelimit.log 2>&1 &
          PORT=3002 STORAGE_MIN_FREE_BYTES=1000000000000000000 nohup npm start > ../be-nospace.log 2>&1 &
          for port in 3000 3001 3002; do
            ok=
            for i in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:$port/health" > /dev/null && { ok=1; break; }
              sleep 1
            done
            [ -n "$ok" ] || { echo "backend :$port did not become healthy"; cat ../be*.log; exit 1; }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Contract tests
        # A skipped contract test (MP_BASE_URL missing) would pass silently, so check they ran.
        run: |
          # Gradle applies --tests/--rerun to the task just before them, so each task gets its own.
          ./gradlew :core:test --tests '*ContractTest' --rerun :feature:test --tests '*ContractTest' --rerun
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          tests = skipped = 0
          for f in glob.glob('*/build/test-results/test/*ContractTest.xml'):
              r = ET.parse(f).getroot()
              tests += int(r.get('tests')); skipped += int(r.get('skipped'))
          print(f'contract tests: {tests} run, {skipped} skipped')
          raise SystemExit(0 if tests and not skipped else 1)
          EOF
      - name: Backend logs
        if: always()
        run: for f in be.log be-ratelimit.log be-nospace.log; do echo "== $f"; cat "$f" || true; done
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-reports
          path: |
            core/build/reports/tests/
            feature/build/reports/tests/
          retention-days: 14

  instrumented:
    # Emulator tests (API 34 x86_64, KVM) with the fake-API flag, then a 5 s launch smoke of the
    # debug APK on the same emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app and test APKs (before booting the emulator)
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The runner executes each line on its own, so multi-step logic lives in a script.
          # connectedDebugAndroidTest uninstalls the app afterwards; the smoke reinstalls it.
          script: |
            ./gradlew connectedDebugAndroidTest
            .github/scripts/launch-smoke.sh
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          retention-days: 14

  debug-apk:
    # The debug APK, uploaded on pushes to main as MekariProject-android-debug-<sha> for device QA.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MekariProject-android-debug-${GITHUB_SHA::7}.apk"
          "$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging dist/*.apk | head -3 || true
      - name: Upload debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MekariProject-android-debug-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30

  release:
    # v* tags only (SPEC-ANDROID §6): a release APK signed with the user's keystore (GitHub secrets),
    # versionName from the tag, versionCode = run number, published as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, lint, contract, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        # Names only; values are never printed (and GitHub masks them in logs anyway).
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::ANDROID_KEYSTORE_* secrets missing: ${missing[*]}. Add them under Settings → Secrets and variables → Actions, then re-run this job."
            exit 1
          fi
          echo "all 4 signing secrets are set"
      - uses: actions/checkout@v4
      - name: Version
        id: version
        # v1.2.3 / v1.2.3-rc1 → versionName 1.2.3 / 1.2.3-rc1; versionCode = run number.
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode the keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          # Fail early, without echoing anything secret, if the password or alias doesn't match.
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1 \
            || { echo "::error::the keystore can't be opened with ANDROID_KEYSTORE_PASSWORD, or has no key named ANDROID_KEY_ALIAS"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Release builds don't write the shared cache.
          cache-read-only: true
      - name: Build the signed release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" -PversionCode="${{ steps.version.outputs.code }}"
      - name: Verify and name the APK
        id: apk
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SRC=app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || { echo "::error::no signed APK (app-release.apk) was produced"; ls app/build/outputs/apk/release; exit 1; }
          mkdir -p dist
          APK="dist/MekariProject-android-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | tee dist/signing.txt
          badging=$("$BT/aapt2" dump badging "$APK" | head -1)
          echo "$badging"
          grep -q "versionCode='${{ steps.version.outputs.code }}' versionName='${{ steps.version.outputs.name }}'" <<< "$badging" \
            || { echo "::error::APK version doesn't match the tag"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert=$(grep -m1 'certificate SHA-256 digest' dist/signing.txt | sed 's/.*digest: //')" >> "$GITHUB_OUTPUT"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          CERT_SHA256: ${{ steps.apk.outputs.cert }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          notes=$(cat <<'NOTES'
          Android 8.0+ (API 26). Signed release APK. To install on a phone:

          1. Download the `.apk` below on the phone (or `adb install -r <file>.apk` from a computer).
          2. Open it; if asked, allow **Install unknown apps** for your browser or Files app, then **Install**.
          3. Later releases install over this one (same signing key). A **debug** build from CI is signed with a different key: uninstall it first, or the install fails with "App not installed" / `INSTALL_FAILED_UPDATE_INCOMPATIBLE`.
          NOTES
          )
          notes="$notes"$'\n\n'"versionCode \`$VERSION_CODE\` · APK SHA-256 \`$APK_SHA256\` · signing certificate SHA-256 \`$CERT_SHA256\`"
          gh release create "$GITHUB_REF_NAME" "$APK" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Mekari Project for Android ${GITHUB_REF_NAME#v}" "${prerelease[@]}" --generate-notes \
            --notes "$notes"
